<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- ══ SEO PRIMARY ══ -->
    <title>Descargar Caresse, iOS y Android</title>
    <meta name="description" content="Descarga Caresse gratis en iOS o Android. Redirección automática a la tienda correcta.">
    <meta name="robots" content="noindex, follow">
    <meta name="author" content="Studio Mokuton">
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png">
    <link rel="canonical" href="https://caresse.app/es/download/">
    <meta name="theme-color" content="#5D3D8C">
    <meta name="format-detection" content="telephone=no">

    <!-- ══ HREFLANG ══ -->
    <link rel="alternate" hreflang="fr" href="https://caresse.app/download/">
    <link rel="alternate" hreflang="en" href="https://caresse.app/en/download/">
    <link rel="alternate" hreflang="es" href="https://caresse.app/es/download/">
    <link rel="alternate" hreflang="x-default" href="https://caresse.app/download/">

    <style>
        :root {
            --primary: #5D3D8C;
            --secondary: #9E7BB5;
            --primary-vibrant: #9361FD;
            --background: #F9F7FD;
            --surface: #FFFFFF;
            --text-primary: #1A1A2E;
            --text-secondary: #5D5D7A;
            --grad-primary: linear-gradient(135deg, #9361FD, #5D3D8C);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: -apple-system, system-ui, sans-serif;
            background-color: var(--background);
            color: var(--text-primary);
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        .card {
            background: var(--surface);
            border-radius: 24px;
            padding: 48px 32px;
            max-width: 420px;
            width: 100%;
            text-align: center;
            box-shadow: 0 20px 60px rgba(93,61,140,0.12);
        }

        h1 {
            font-size: 1.5rem;
            margin-bottom: 12px;
        }

        p {
            color: var(--text-secondary);
            margin-bottom: 32px;
        }

        .store-link {
            display: block;
            width: 100%;
            padding: 16px;
            border-radius: 14px;
            background: var(--grad-primary);
            color: #fff;
            text-decoration: none;
            font-weight: 600;
            margin-bottom: 14px;
            transition: transform 0.15s ease;
        }

        .store-link:active {
            transform: scale(0.97);
        }

        .store-link.secondary {
            background: var(--surface);
            color: var(--primary);
            border: 2px solid var(--secondary);
        }
    </style>
    <!-- Umami Analytics -->
    <script defer src="https://cloud.umami.is/script.js" data-website-id="4a1be662-e78b-4d4e-8a5d-c5791756a46a" data-domains="caresse.app"></script>
    <script defer src="/umami-store-tracking.js"></script>
    <script defer src="/mobile-store-cta.js"></script>
</head>
<body>
    <div class="card">
        <h1>Descargar Caresse</h1>
        <p>Redirigiendo automáticamente… si no ocurre nada, elige tu plataforma:</p>
        <a class="store-link" id="ios-link" href="https://apps.apple.com/us/app/caresse/id6758887086">Descargar en App Store</a>
        <a class="store-link secondary" id="android-link" href="https://play.google.com/store/apps/details?id=com.flareai.caresse">Disponible en Google Play</a>
    </div>

    <script>
        (function () {
            var ua = navigator.userAgent || navigator.vendor || '';

            // Ne jamais rediriger les robots d'indexation : Googlebot smartphone
            // s'identifie comme Android et hériterait du title du Play Store.
            var BOT = /bot|crawl|spider|slurp|bingpreview|google-inspectiontool|duckduckbot|baiduspider|yandex|facebookexternalhit|embedly|quora link preview|showyoubot|outbrain|pinterest|slackbot|vkshare|w3c_validator|whatsapp|telegrambot|twitterbot|applebot|petalbot|ahrefsbot|semrushbot|mj12bot|dotbot|headlesschrome|lighthouse/i;
            if (BOT.test(ua)) { return; }

            var iosUrl = document.getElementById('ios-link').href;
            if (/iPad|iPhone|iPod/.test(ua)) {
                window.location.replace(iosUrl);
            }
        })();
    </script>
</body>
</html>
