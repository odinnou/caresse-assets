name: Build and deploy static Astro site

on:
  pull_request:
  push:
    branches: [main_v2]
  workflow_dispatch:
    inputs:
      compare_migration:
        description: Compare the migration pilot with its legacy baseline
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run test:i18n
      - run: npm run test:parity
        if: github.head_ref == 'feat/90-astro-static' || inputs.compare_migration
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -r requirements-test.txt
      - run: python -m playwright install --with-deps chromium
      - run: python scripts/check-how-it-works-browser.py
      - run: python scripts/check-german-browser.py
      - run: npm run test:browser
        if: github.head_ref == 'feat/90-astro-static' || inputs.compare_migration
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: migration-comparison
          path: |
            artifacts/
            package-lock.json
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main_v2'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy generated static files
        id: deployment
        uses: actions/deploy-pages@v4
