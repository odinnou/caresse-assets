<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Audio demo moved — Caresse</title>
    <link rel="canonical" href="https://caresse.app/en/demo/solo-sensual-discovery/">
    <meta http-equiv="refresh" content="0; url=https://caresse.app/en/demo/solo-sensual-discovery/">
    <script>
        (function () {
            var targetPath = "/en/demo/solo-sensual-discovery/";
            var target = 'https://caresse.app' + targetPath + window.location.search + window.location.hash;
            try {
                sessionStorage.setItem('caresse_redirect_context', JSON.stringify({
                    target_path: targetPath, referrer: document.referrer, created_at: Date.now()
                }));
            } catch (_) {}
            document.querySelector('meta[http-equiv="refresh"]').setAttribute('content', '0; url=' + target);
            window.location.replace(target);
        })();
    </script>
</head>
<body>
    <p><a href="https://caresse.app/en/demo/solo-sensual-discovery/">Open the audio demo</a></p>
</body>
</html>
